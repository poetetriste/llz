[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llz-codec"
version = "0.2.0"
description = "Verified lossless text compression with a language model and arithmetic coding."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["compression", "llm", "arithmetic-coding", "lossless"]
dependencies = [
    "torch>=2.5,<3",
    "transformers>=4.45,<6",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
brotli = ["brotli>=1.1,<2"]

[project.scripts]
llz = "llz.cli:main"
llz-server = "llz.server:main"

[tool.setuptools]
packages = ["llz"]
