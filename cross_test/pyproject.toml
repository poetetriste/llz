[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llz-codec"
version = "0.2.0"
description = "Standalone cross-machine determinism harness for LLZ."
requires-python = ">=3.10"
license = "MIT"
keywords = ["compression", "llm", "arithmetic-coding", "lossless"]
dependencies = [
    "torch==2.14.1",
    "transformers==5.22.1",
    "numpy==2.5.4",
]

[project.optional-dependencies]
brotli = ["brotli"]

[project.scripts]
llz = "llz.cli:main"
llz-server = "llz.server:main"

[tool.setuptools]
packages = ["llz"]
